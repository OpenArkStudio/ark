syntax = "proto3";
import "entity_sync.proto";
package ark.protobuf.guest_room;
option csharp_namespace = "Ark.Client.Protocol";

// Canonical C++/C# room contract. Transport framing remains a separate layer.
message join_request {
  string name = 1;
  string room = 2;
  uint32 protocol_version = 3;
}

message join_accepted {
  string player_id = 1;
  string name = 2;
  string room = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint64 entity_id = 6;
  uint32 protocol_version = 7;
}

message move_request {
  uint32 sequence = 1;
  double x = 2;
  double y = 3;
}

enum action_kind {
  action_unspecified = 0;
  action_damage = 1;
  action_skill = 2;
  action_rest = 3;
  action_pickup = 4;
  action_use_potion = 5;
  action_equip = 6;
  action_upgrade = 7;
}

message action_request {
  uint32 sequence = 1;
  action_kind kind = 2;
}

message error_response {
  string code = 1;
  string message = 2;
  optional uint32 action_sequence = 3;
}

message heartbeat {
  uint32 nonce = 1;
}

// Application-owned instance bindings are separate from untrusted state values.
// The field/type projection is fixed by the sample on both sides, not supplied
// by this message. The two declared equipment identities remain fixed per
// stream.
message player_binding {
  uint64 entity_id = 1;
  uint64 incarnation = 2;
  uint64 generation = 3;
  repeated sint64 equipment_ids = 4;
}

message player_baseline {
  string player_id = 1;
  ark.protobuf.entity_sync.nested_baseline state = 2;
  player_binding binding = 3;
}

message room_baseline {
  string room = 1;
  repeated player_baseline players = 2;
}

message room_delta {
  string room = 1;
  repeated player_baseline added = 2;
  repeated ark.protobuf.entity_sync.nested_delta changed = 3;
}
