<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" role="img" aria-labelledby="title desc">
  <title id="title">Runtime paths share one working directory</title>
  <desc id="desc">The process working directory contains configuration, plugin libraries and optional Kernel resources. Moving the application manifest does not change the base for relative paths.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#0f172a}
    .heading{font-size:16px;fill:#475569}.base{font:600 23px ui-monospace,SFMono-Regular,Consolas,monospace}
    .dir{font:600 20px ui-monospace,SFMono-Regular,Consolas,monospace}.file{font:15px ui-monospace,SFMono-Regular,Consolas,monospace}
    .small{font-size:12px}.note{font-size:13px;fill:#475569}.footer{font-size:15px;fill:#475569}
  </style>
  <rect x="1" y="1" width="958" height="390" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="37" text-anchor="middle" class="heading">One process working directory</text>
  <rect x="320" y="53" width="320" height="51" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="480" y="86" text-anchor="middle" class="base">run/timers/</text>
  <path d="M480 104V132H168V156" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="24" y="156" width="288" height="168" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <rect x="24" y="156" width="288" height="44" rx="12" fill="#e0f2fe"/>
  <text x="42" y="185" class="dir">conf/</text>
  <text x="42" y="229" class="file">timers.app.toml</text>
  <text x="42" y="258" class="file">[logging] (optional)</text>
  <text x="42" y="298" class="note">Per-plugin files, when configured</text>
  <path d="M480 104V132H472V156" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="328" y="156" width="288" height="168" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <rect x="328" y="156" width="288" height="44" rx="12" fill="#e0f2fe"/>
  <text x="346" y="185" class="dir">bin/</text>
  <text x="346" y="229" class="file">app</text>
  <text x="346" y="258" class="file small">ark_utility_plugin + timers_plugin</text>
  <text x="346" y="298" class="note">Platform suffix; matching build</text>
  <path d="M480 104V132H776V156" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="632" y="156" width="288" height="168" rx="12" fill="#fff" stroke="#cbd5e1"/>
  <rect x="632" y="156" width="288" height="44" rx="12" fill="#e0f2fe"/>
  <text x="650" y="185" class="dir">resource/</text>
  <text x="650" y="229" class="file">meta/</text>
  <text x="650" y="258" class="file">server/</text>
  <text x="650" y="298" class="note">For applications that load Kernel data</text>
  <text x="480" y="363" text-anchor="middle" class="footer">Relative paths use this base, not the manifest directory.</text>
</svg>
