<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto"><title id="title">Identity and explicit authorization</title><desc id="desc">A server-bound session authorizes a root GUID and incarnation. Separate branches select scalar indices, table rows and columns, or container slots and child identities with recursively authorized members.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1464f4"/></marker></defs><rect width="720" height="770" rx="16" fill="#f7faff"/><g font-family="Inter, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="24" y="32" text-anchor="start" fill="#1464f4" font-size="20" font-weight="600"><tspan x="24" dy="0">Identity and explicit authorization</tspan></text><rect x="196" y="58" width="328" height="76" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="360" y="89.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="360" dy="0">Server-bound session</tspan><tspan x="360" dy="24.3">and authorization</tspan></text><path d="M360 135 V165" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="196" y="170" width="328" height="66" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="360" y="209.12" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="360" dy="0">Root GUID + incarnation</tspan></text><path d="M360 237 V260 H126 V286" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M360 237 V286" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M360 260 H594 V286" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="292" width="212" height="84" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="126" y="327.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="126" dy="0">Authorized scalar</tspan><tspan x="126" dy="24.3">member indices</tspan></text><rect x="254" y="292" width="212" height="84" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="360" y="340.12" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="360" dy="0">Table member index</tspan></text><rect x="488" y="292" width="212" height="84" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="594" y="327.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="594" dy="0">Container member</tspan><tspan x="594" dy="24.3">index</tspan></text><path d="M360 377 V407" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M594 377 V407" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="254" y="413" width="212" height="84" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="360" y="448.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="360" dy="0">Row number +</tspan><tspan x="360" dy="24.3">lifetime token</tspan></text><rect x="488" y="413" width="212" height="84" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="594" y="448.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="594" dy="0">Slot number:</tspan><tspan x="594" dy="24.3">relationship</tspan></text><path d="M360 498 V528" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M594 498 V528" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="254" y="534" width="212" height="88" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="360" y="571.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="360" dy="0">Column index in</tspan><tspan x="360" dy="24.3">referenced row class</tspan></text><rect x="488" y="534" width="212" height="88" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="594" y="571.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="594" dy="0">Child GUID +</tspan><tspan x="594" dy="24.3">incarnation</tspan></text><path d="M594 623 V653" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="488" y="659" width="212" height="88" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="594" y="684" text-anchor="middle" fill="#11213b" font-size="18"><tspan x="594" dy="0">Child class +</tspan><tspan x="594" dy="24.3">recursively authorized</tspan><tspan x="594" dy="24.3">members</tspan></text></g></svg>
