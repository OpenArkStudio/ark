<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 218" role="img" aria-labelledby="title desc"><title id="title">拟议数据流程</title><desc id="desc">连接或重连：全量状态   ·   正常变更：增量   ·   队列超限：断开后重建全量</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1464f4"/></marker></defs><g font-family="Inter, Noto Sans CJK SC, PingFang SC, sans-serif"><rect x="8" y="44" width="656" height="114" rx="12" fill="#edf4ff"/><text x="20" y="26" fill="#1464f4" font-size="17" font-weight="600">拟议数据流程</text><text x="20" y="66" fill="#425674" font-size="12">服务端所属线程</text><rect x="20" y="82" width="198" height="64" rx="8" fill="#ffffff" stroke="#7392bb"/><text x="119" y="109" text-anchor="middle" fill="#11213b" font-size="15" font-weight="600">修改 Entity</text><text x="119" y="131" text-anchor="middle" fill="#425674" font-size="11">业务模块</text><path d="M219 114H235" stroke="#1464f4" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="82" width="198" height="64" rx="8" fill="#ffffff" stroke="#7392bb"/><text x="339" y="109" text-anchor="middle" fill="#11213b" font-size="15" font-weight="600">记录变化值</text><text x="339" y="131" text-anchor="middle" fill="#425674" font-size="11">批次独立持有值副本</text><path d="M439 114H455" stroke="#1464f4" stroke-width="2" marker-end="url(#arrow)"/><rect x="460" y="82" width="198" height="64" rx="8" fill="#ffffff" stroke="#7392bb"/><text x="559" y="109" text-anchor="middle" fill="#11213b" font-size="15" font-weight="600">筛选可见字段</text><text x="559" y="131" text-anchor="middle" fill="#425674" font-size="11">构造全量或增量</text><path d="M659 114H695" stroke="#1464f4" stroke-width="2" marker-end="url(#arrow)"/><rect x="700" y="82" width="198" height="64" rx="8" fill="#ffffff" stroke="#7392bb"/><text x="799" y="109" text-anchor="middle" fill="#11213b" font-size="15" font-weight="600">Net 有序队列</text><text x="799" y="131" text-anchor="middle" fill="#425674" font-size="11">TCP / WebSocket</text><path d="M899 114H915" stroke="#1464f4" stroke-width="2" marker-end="url(#arrow)"/><rect x="920" y="82" width="198" height="64" rx="8" fill="#ffffff" stroke="#7392bb"/><text x="1019" y="109" text-anchor="middle" fill="#11213b" font-size="15" font-weight="600">Godot C#</text><text x="1019" y="131" text-anchor="middle" fill="#425674" font-size="11">应用状态并更新画面</text><text x="20" y="195" fill="#52759b" font-size="13">连接或重连：全量状态   ·   正常变更：增量   ·   队列超限：断开后重建全量</text></g></svg>
