<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 772" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto"><title id="title">Nested C++ publication and candidate commit</title><desc id="desc">An independently trusted fixed binding validates captured states and received baselines or patches. Build owning publications before publisher commit. The replica validates the complete candidate and lifetime history before one root commit. Allocation exceptions preserve old state and revision; invalid input terminally invalidates the replica. No wire format or delivery acknowledgement.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1464f4"/></marker></defs><rect width="680" height="772" rx="16" fill="#f7faff"/><g font-family="Inter, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="24" y="34" text-anchor="start" fill="#1464f4" font-size="20" font-weight="600"><tspan x="24" dy="0">Nested C++ publication and candidate commit</tspan></text><rect x="20" y="62" width="640" height="106" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="340" y="96.7" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="340" dy="0">Independently trusted fixed binding</tspan><tspan x="340" dy="24.3">Schema / root lifetime / generation</tspan><tspan x="340" dy="24.3">Per-class types and authorized members / child GUIDs</tspan></text><path d="M340 169 V192 H175 V218" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M340 192 H505 V218" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="224" width="310" height="90" rx="12" fill="#fff" stroke="#7392bb"/><text x="175" y="251" text-anchor="middle" fill="#11213b" font-size="18"><tspan x="175" dy="0">Publisher</tspan><tspan x="175" dy="24.3">Validate complete</tspan><tspan x="175" dy="24.3">authorized capture</tspan></text><rect x="350" y="224" width="310" height="90" rx="12" fill="#fff" stroke="#7392bb"/><text x="505" y="262.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="505" dy="0">Replica</tspan><tspan x="505" dy="24.3">Validate baseline / patch</tspan></text><path d="M175 315 V350" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M505 315 V350" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="356" width="310" height="100" rx="12" fill="#fff" stroke="#7392bb"/><text x="175" y="399.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="175" dy="0">Build owning packet</tspan><tspan x="175" dy="24.3">and replacement local state first</tspan></text><rect x="350" y="356" width="310" height="100" rx="12" fill="#fff" stroke="#7392bb"/><text x="505" y="399.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="505" dy="0">Build complete candidate</tspan><tspan x="505" dy="24.3">Check totals and lifetime history</tspan></text><path d="M331 543 H340 V269 H347" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M175 457 V492" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M505 457 V492" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="498" width="310" height="90" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="175" y="536.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="175" dy="0">After all allocations:</tspan><tspan x="175" dy="24.3">advance publisher state / revision</tspan></text><rect x="350" y="498" width="310" height="90" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="505" y="536.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="505" dy="0">After all validation:</tspan><tspan x="505" dy="24.3">replace the whole root once</tspan></text><rect x="20" y="624" width="640" height="122" rx="12" fill="#edf4ff"/><text x="340" y="660" text-anchor="middle" fill="#425674" font-size="18" font-weight="400"><tspan x="340" dy="0">Allocation exception: preserve old state / revision</tspan><tspan x="340" dy="24.3">Invalid input: invalidate replica; expose no partial candidate</tspan><tspan x="340" dy="24.3">C++ values only; no wire format or delivery acknowledgement</tspan></text></g></svg>
