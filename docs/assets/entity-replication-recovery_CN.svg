<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 785" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto"><title id="title">根状态与已选恢复路径</title><desc id="desc">初始进入 NeedBaseline；完整授权基线进入 Active。匹配增量或合法重复保持 Active；缺口、非法身份、溢出或撤权进入 Invalid，重连后回到 NeedBaseline；有序根删除标记进入 Removed，新的授权存续期或流回到 NeedBaseline。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1464f4"/></marker></defs><rect width="800" height="785" rx="16" fill="#f7faff"/><g font-family="Inter, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="24" y="34" text-anchor="start" fill="#1464f4" font-size="20" font-weight="600"><tspan x="24" dy="0">根状态与已选恢复路径</tspan></text><circle cx="400" cy="68" r="7" fill="#11213b"/><path d="M400 76 V103" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="240" y="110" width="320" height="72" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="400" y="153.14" text-anchor="middle" fill="#11213b" font-size="21" font-weight="400"><tspan x="400" dy="0">NeedBaseline</tspan></text><rect x="240" y="340" width="320" height="72" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="400" y="383.14" text-anchor="middle" fill="#11213b" font-size="21" font-weight="400"><tspan x="400" dy="0">Active</tspan></text><rect x="70" y="630" width="280" height="72" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="210" y="673.14" text-anchor="middle" fill="#11213b" font-size="21" font-weight="400"><tspan x="210" dy="0">Invalid</tspan></text><rect x="450" y="630" width="280" height="72" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="590" y="673.14" text-anchor="middle" fill="#11213b" font-size="21" font-weight="400"><tspan x="590" dy="0">Removed</tspan></text><path d="M400 183 V333" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="274" y="223" width="252" height="59" rx="8" fill="#f7faff"/><text x="400" y="248" text-anchor="middle" fill="#425674" font-size="18" font-weight="400"><tspan x="400" dy="0">完整授权基线</tspan></text><path d="M560 360 H650 V391 H567" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><text x="670" y="447" text-anchor="middle" fill="#425674" font-size="16" font-weight="400"><tspan x="670" dy="0">匹配增量</tspan><tspan x="670" dy="21.6">或合法重复</tspan></text><path d="M315 413 L210 623" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="52" y="475" width="316" height="61" rx="8" fill="#f7faff"/><text x="210" y="500" text-anchor="middle" fill="#425674" font-size="17" font-weight="400"><tspan x="210" dy="0">缺口／非法身份／</tspan><tspan x="210" dy="22.950000000000003">溢出／投影撤权</tspan></text><path d="M485 413 L590 623" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="454" y="534" width="256" height="40" rx="8" fill="#f7faff"/><text x="582" y="558" text-anchor="middle" fill="#425674" font-size="17" font-weight="400"><tspan x="582" dy="0">有序的根删除标记</tspan></text><path d="M70 666 H24 V146 H233" fill="none" stroke="#1464f4" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="132" y="250" text-anchor="middle" fill="#425674" font-size="17" font-weight="400"><tspan x="132" dy="0">重连</tspan><tspan x="132" dy="22.950000000000003">（已选方向）</tspan></text><path d="M730 666 H776 V146 H567" fill="none" stroke="#1464f4" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="674" y="250" text-anchor="middle" fill="#425674" font-size="17" font-weight="400"><tspan x="674" dy="0">新的授权</tspan><tspan x="674" dy="22.950000000000003">存续期／流</tspan></text><text x="400" y="753" text-anchor="middle" fill="#52759b" font-size="16" font-weight="400"><tspan x="400" dy="0">实线：状态推进／校验；虚线：重新获取完整基线</tspan></text></g></svg>
