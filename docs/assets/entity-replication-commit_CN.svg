<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1040" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto"><title id="title">一个根的有序提交：交互顺序</title><desc id="desc">K → P: 修改结束，在显式刷新点捕获; P → P: 授权、复制值、比较前一投影; P → Q: 封装完整基线 R 或增量 R 到 R+1; Q → C: 一个有序的拥有型发布; C → C: 校验全部身份、类型、上限 和基准修订; C → C: 整根提交或使整根失效。P／Q 注记：回调修改进入下一批。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1464f4"/></marker></defs><rect width="600" height="1040" rx="16" fill="#f7faff"/><g font-family="Inter, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="24" y="34" text-anchor="start" fill="#1464f4" font-size="20" font-weight="600"><tspan x="24" dy="0">一个根的有序提交：交互顺序</tspan></text><rect x="20" y="58" width="268" height="50" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="154" y="88.78" text-anchor="middle" fill="#11213b" font-size="17" font-weight="400"><tspan x="154" dy="0">K · 所有者线程 Entity 树</tspan></text><rect x="312" y="58" width="268" height="50" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="446" y="88.78" text-anchor="middle" fill="#11213b" font-size="17" font-weight="400"><tspan x="446" dy="0">P · 投影收集器</tspan></text><rect x="20" y="120" width="268" height="50" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="154" y="150.78" text-anchor="middle" fill="#11213b" font-size="17" font-weight="400"><tspan x="154" dy="0">Q · 有界有序发送端</tspan></text><rect x="312" y="120" width="268" height="50" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="446" y="150.78" text-anchor="middle" fill="#11213b" font-size="17" font-weight="400"><tspan x="446" dy="0">C · 客户端候选状态</tspan></text><rect x="20" y="204" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="235" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">1. K → P</tspan></text><text x="166" y="240" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">修改结束，在显式刷新点捕获</tspan></text><path d="M300 294 V319" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="326" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="357" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">2. P → P</tspan></text><text x="166" y="362" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">授权、复制值、比较前一投影</tspan></text><path d="M300 416 V441" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="448" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="479" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">3. P → Q</tspan></text><text x="166" y="472" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">封装完整基线 R</tspan><tspan x="166" dy="24.3">或增量 R 到 R+1</tspan></text><path d="M300 538 V563" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="570" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="601" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">4. Q → C</tspan></text><text x="166" y="606" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">一个有序的拥有型发布</tspan></text><path d="M300 660 V685" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="692" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="723" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">5. C → C</tspan></text><text x="166" y="716" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">校验全部身份、类型、上限</tspan><tspan x="166" dy="24.3">和基准修订</tspan></text><path d="M300 782 V807" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="814" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="845" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">6. C → C</tspan></text><text x="166" y="850" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">整根提交或使整根失效</tspan></text><rect x="20" y="952" width="560" height="66" rx="12" fill="#edf4ff"/><text x="300" y="980" text-anchor="middle" fill="#425674" font-size="18" font-weight="400"><tspan x="300" dy="0">P／Q 注记：回调修改进入下一批</tspan></text></g></svg>
