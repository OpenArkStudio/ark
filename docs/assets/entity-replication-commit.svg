<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1040" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto"><title id="title">One ordered root commit: interaction sequence</title><desc id="desc">K → P: Finish mutations; capture at explicit flush; P → P: Authorize; copy values; compare previous projection; P → Q: Seal complete baseline R or delta R to R+1; Q → C: One ordered owning publication; C → C: Validate all identities, types, limits and base revision; C → C: Commit whole root or invalidate root. Note over P and Q: callback mutations enter the next batch.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1464f4"/></marker></defs><rect width="600" height="1040" rx="16" fill="#f7faff"/><g font-family="Inter, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="24" y="34" text-anchor="start" fill="#1464f4" font-size="20" font-weight="600"><tspan x="24" dy="0">One ordered root commit: interaction sequence</tspan></text><rect x="20" y="58" width="268" height="50" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="154" y="88.44" text-anchor="middle" fill="#11213b" font-size="16" font-weight="400"><tspan x="154" dy="0">K · Owner-thread Entity tree</tspan></text><rect x="312" y="58" width="268" height="50" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="446" y="88.44" text-anchor="middle" fill="#11213b" font-size="16" font-weight="400"><tspan x="446" dy="0">P · Projection collector</tspan></text><rect x="20" y="120" width="268" height="50" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="154" y="150.44" text-anchor="middle" fill="#11213b" font-size="16" font-weight="400"><tspan x="154" dy="0">Q · Bounded ordered sender</tspan></text><rect x="312" y="120" width="268" height="50" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="446" y="150.44" text-anchor="middle" fill="#11213b" font-size="16" font-weight="400"><tspan x="446" dy="0">C · Client candidate state</tspan></text><rect x="20" y="204" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="235" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">1. K → P</tspan></text><text x="166" y="228" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">Finish mutations; capture</tspan><tspan x="166" dy="24.3">at explicit flush</tspan></text><path d="M300 294 V319" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="326" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="357" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">2. P → P</tspan></text><text x="166" y="350" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">Authorize; copy values;</tspan><tspan x="166" dy="24.3">compare previous projection</tspan></text><path d="M300 416 V441" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="448" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="479" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">3. P → Q</tspan></text><text x="166" y="472" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">Seal complete baseline R</tspan><tspan x="166" dy="24.3">or delta R to R+1</tspan></text><path d="M300 538 V563" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="570" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="601" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">4. Q → C</tspan></text><text x="166" y="606" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">One ordered owning publication</tspan></text><path d="M300 660 V685" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="692" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="723" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">5. C → C</tspan></text><text x="166" y="716" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">Validate all identities, types,</tspan><tspan x="166" dy="24.3">limits and base revision</tspan></text><path d="M300 782 V807" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="814" width="560" height="90" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="42" y="845" text-anchor="start" fill="#1464f4" font-size="19" font-weight="600"><tspan x="42" dy="0">6. C → C</tspan></text><text x="166" y="850" text-anchor="start" fill="#11213b" font-size="18" font-weight="400"><tspan x="166" dy="0">Commit whole root or invalidate root</tspan></text><rect x="20" y="952" width="560" height="66" rx="12" fill="#edf4ff"/><text x="300" y="980" text-anchor="middle" fill="#425674" font-size="18" font-weight="400"><tspan x="300" dy="0">Note over P / Q:</tspan><tspan x="300" dy="24.3">Callback mutations enter the next batch</tspan></text></g></svg>
