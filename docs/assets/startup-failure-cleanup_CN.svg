<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto"><title id="title">拟议启动失败清理：始终退出 1</title><desc id="desc">先预留自有上下文和清理记录，再获取资源。预留失败不获取资源并退出1。启动失败只运行已登记的独立动作，未登记、不安全或动作异常仍走失败退出。所有已加载代码和未回收所有者保留到退出，不执行正常停机或卸载。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1464f4"/></marker></defs><rect width="800" height="800" rx="16" fill="#f7faff"/><g font-family="Inter, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="24" y="34" text-anchor="start" fill="#1464f4" font-size="20" font-weight="600"><tspan x="24" dy="0">拟议启动失败清理：始终退出 1</tspan></text><rect x="200" y="70" width="500" height="90" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="450" y="108.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="450" dy="0">获取前准备自有上下文</tspan><tspan x="450" dy="24.3">并预留有界清理槽位</tspan></text><path d="M450 161 V190" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="200" y="196" width="500" height="90" rx="12" fill="#fff" stroke="#7392bb"/><text x="450" y="234.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="450" dy="0">获取／构造资源</tspan><tspan x="450" dy="24.3">在上下文中保留部分获取</tspan></text><path d="M450 287 V316" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="200" y="322" width="500" height="90" rx="12" fill="#fff" stroke="#7392bb"/><text x="450" y="360.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="450" dy="0">启动返回 false／抛异常</tspan><tspan x="450" dy="24.3">外层启动调用已退出</tspan></text><path d="M450 413 V442" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="200" y="448" width="500" height="90" rx="12" fill="#fff" stroke="#7392bb"/><text x="450" y="486.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="450" dy="0">只执行已登记的独立清理</tspan><tspan x="450" dy="24.3">一次；不访问未完成的 this</tspan></text><path d="M450 539 V584" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="300" y="590" width="300" height="66" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="450" y="630.48" text-anchor="middle" fill="#11213b" font-size="22" font-weight="400"><tspan x="450" dy="0">退出 1</tspan></text><path d="M200 115 H34 V623 H293" fill="none" stroke="#1464f4" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="114" y="238" text-anchor="middle" fill="#425674" font-size="17" font-weight="400"><tspan x="114" dy="0">预留失败</tspan><tspan x="114" dy="22.950000000000003">不执行本次获取</tspan></text><path d="M700 367 H756 V623 H607" fill="none" stroke="#1464f4" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="620" y="550" width="150" height="55" fill="#f7faff"/><text x="697" y="568" text-anchor="middle" fill="#425674" font-size="15" font-weight="400"><tspan x="697" dy="0">未登记／不安全</tspan><tspan x="697" dy="20.25">或清理异常</tspan></text><rect x="20" y="697" width="740" height="80" rx="12" fill="#edf4ff"/><text x="390" y="728" text-anchor="middle" fill="#425674" font-size="17" font-weight="400"><tspan x="390" dy="0">保留全部已加载代码及未回收所有者直到退出</tspan><tspan x="390" dy="22.950000000000003">不调用正常停机／卸载，不推断业务回滚</tspan></text></g></svg>
