<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 772" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto"><title id="title">嵌套 C++ 发布与候选提交</title><desc id="desc">可信固定绑定分别校验发布端捕获与接收端基线／补丁。发布端先创建拥有型数据包与新状态，再推进本地状态；接收端先验证完整候选与身份历史，再一次提交整根。分配异常保留旧状态与修订，非法输入使接收端终态失效。不包含线协议或交付确认。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1464f4"/></marker></defs><rect width="680" height="772" rx="16" fill="#f7faff"/><g font-family="Inter, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="24" y="34" text-anchor="start" fill="#1464f4" font-size="20" font-weight="600"><tspan x="24" dy="0">嵌套 C++ 发布与候选提交</tspan></text><rect x="20" y="62" width="640" height="106" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="340" y="96.7" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="340" dy="0">独立可信的固定绑定</tspan><tspan x="340" dy="24.3">Schema／根存续期／流代次</tspan><tspan x="340" dy="24.3">逐类类型与授权成员／子 GUID</tspan></text><path d="M340 169 V192 H175 V218" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M340 192 H505 V218" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="224" width="310" height="90" rx="12" fill="#fff" stroke="#7392bb"/><text x="175" y="262.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="175" dy="0">发布端</tspan><tspan x="175" dy="24.3">校验完整授权捕获</tspan></text><rect x="350" y="224" width="310" height="90" rx="12" fill="#fff" stroke="#7392bb"/><text x="505" y="262.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="505" dy="0">接收端</tspan><tspan x="505" dy="24.3">校验基线／补丁</tspan></text><path d="M175 315 V350" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M505 315 V350" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="356" width="310" height="100" rx="12" fill="#fff" stroke="#7392bb"/><text x="175" y="399.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="175" dy="0">先创建拥有型数据包</tspan><tspan x="175" dy="24.3">及替代本地状态</tspan></text><rect x="350" y="356" width="310" height="100" rx="12" fill="#fff" stroke="#7392bb"/><text x="505" y="399.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="505" dy="0">先构造完整候选</tspan><tspan x="505" dy="24.3">校验总量及身份历史</tspan></text><path d="M331 543 H340 V269 H347" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M175 457 V492" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M505 457 V492" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="498" width="310" height="90" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="175" y="536.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="175" dy="0">全部分配完成后</tspan><tspan x="175" dy="24.3">推进发布状态／修订</tspan></text><rect x="350" y="498" width="310" height="90" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="505" y="536.85" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="505" dy="0">全部校验完成后</tspan><tspan x="505" dy="24.3">一次替换整根</tspan></text><rect x="20" y="624" width="640" height="122" rx="12" fill="#edf4ff"/><text x="340" y="660" text-anchor="middle" fill="#425674" font-size="18" font-weight="400"><tspan x="340" dy="0">分配异常：旧状态／修订不变</tspan><tspan x="340" dy="24.3">非法输入：接收端失效，不暴露部分候选</tspan><tspan x="340" dy="24.3">纯 C++ 值；无线协议或交付确认</tspan></text></g></svg>
