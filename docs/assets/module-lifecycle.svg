<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 158" role="img" aria-labelledby="title desc">
  <title id="title">Module lifecycle</title>
  <desc id="desc">Validate startup providers, run four provider-first startup phases, then update. Stop new roots consumer-first once; task and readiness drain precede pre_shut and shut. Remaining teardown order is unchanged.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#64748b"/></marker></defs>
  <g fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M136 64H158M248 64H270M382 64H404M516 64H538M650 64H672M784 64H806M954 64H976M1088 64H1110"/>
    <path d="M756 42V20H700V42"/>
  </g>
  <g fill="#f1f5f9" stroke="#94a3b8">
    <rect x="8" y="42" width="128" height="44" rx="8"/>
    <rect x="158" y="42" width="90" height="44" rx="8"/><rect x="270" y="42" width="112" height="44" rx="8"/>
    <rect x="404" y="42" width="112" height="44" rx="8"/><rect x="538" y="42" width="112" height="44" rx="8"/>
    <rect x="672" y="42" width="112" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="806" y="42" width="148" height="44" rx="8"/><rect x="976" y="42" width="112" height="44" rx="8"/>
    <rect x="1110" y="42" width="112" height="44" rx="8"/>
  </g>
  <g fill="#0f172a" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">
    <text x="72" y="69">dependencies</text><text x="203" y="69">init()</text><text x="326" y="69">post_init()</text>
    <text x="460" y="69">check_config()</text><text x="594" y="69">pre_update()</text><text x="728" y="69">update()</text>
    <text x="880" y="69">stop_accepting()</text><text x="1032" y="69">pre_shut()</text><text x="1166" y="69">shut()</text>
  </g>
  <g fill="#475569" font-family="sans-serif" font-size="13" text-anchor="middle">
    <text x="620" y="118">Startup: providers first. Stop accepting: consumers first.</text>
    <text x="620" y="141">Task/readiness drain precedes pre_shut; other teardown order is unchanged.</text>
  </g>
</svg>
