<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto"><title id="title">身份与显式授权投影</title><desc id="desc">服务端会话与授权绑定根 GUID 和实例代次；根分别选择标量、表格与容器。表格通过行号与存续期标记选择行类列；容器通过槽位关系、子 GUID 与实例代次递归授权成员。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1464f4"/></marker></defs><rect width="720" height="770" rx="16" fill="#f7faff"/><g font-family="Inter, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="24" y="32" text-anchor="start" fill="#1464f4" font-size="20" font-weight="600"><tspan x="24" dy="0">身份与显式授权投影</tspan></text><rect x="196" y="58" width="328" height="76" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="360" y="102.12" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="360" dy="0">服务端绑定的会话与授权</tspan></text><path d="M360 135 V165" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="196" y="170" width="328" height="66" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="360" y="209.12" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="360" dy="0">根 GUID + 实例代次</tspan></text><path d="M360 237 V260 H126 V286" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M360 237 V286" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M360 260 H594 V286" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="20" y="292" width="212" height="84" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="126" y="327.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="126" dy="0">授权标量</tspan><tspan x="126" dy="24.3">成员索引</tspan></text><rect x="254" y="292" width="212" height="84" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="360" y="340.12" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="360" dy="0">表格成员索引</tspan></text><rect x="488" y="292" width="212" height="84" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="594" y="340.12" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="594" dy="0">容器成员索引</tspan></text><path d="M360 377 V407" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M594 377 V407" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="254" y="413" width="212" height="84" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="360" y="448.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="360" dy="0">行号 +</tspan><tspan x="360" dy="24.3">存续期标记</tspan></text><rect x="488" y="413" width="212" height="84" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="594" y="461.12" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="594" dy="0">槽位号：关系</tspan></text><path d="M360 498 V528" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M594 498 V528" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="254" y="534" width="212" height="88" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="360" y="571.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="360" dy="0">引用行类中的</tspan><tspan x="360" dy="24.3">列索引</tspan></text><rect x="488" y="534" width="212" height="88" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="594" y="571.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="594" dy="0">子 GUID +</tspan><tspan x="594" dy="24.3">实例代次</tspan></text><path d="M594 623 V653" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="488" y="659" width="212" height="88" rx="12" fill="#ffffff" stroke="#7392bb"/><text x="594" y="696.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="594" dy="0">子类 + 递归</tspan><tspan x="594" dy="24