<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc" style="display:block;max-width:100%;height:auto"><title id="title">Proposed startup-failure cleanup: always exit 1</title><desc id="desc">Reserve an owning context and cleanup record before acquiring resources. Reservation failure acquires nothing and exits1. Startup failure runs only enrolled self-contained actions. Unenrolled or unsafe cleanup and cleanup exceptions still take the failure exit. Loaded code and unretired owners remain alive; no normal shutdown or unload occurs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1464f4"/></marker></defs><rect width="800" height="800" rx="16" fill="#f7faff"/><g font-family="Inter, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="24" y="34" text-anchor="start" fill="#1464f4" font-size="20" font-weight="600"><tspan x="24" dy="0">Proposed startup-failure cleanup: always exit 1</tspan></text><rect x="200" y="70" width="500" height="90" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="450" y="108.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="450" dy="0">Prepare owning context</tspan><tspan x="450" dy="24.3">and bounded slot before acquisition</tspan></text><path d="M450 161 V190" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="200" y="196" width="500" height="90" rx="12" fill="#fff" stroke="#7392bb"/><text x="450" y="234.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="450" dy="0">Acquire / construct resource</tspan><tspan x="450" dy="24.3">Retain partial acquisition in context</tspan></text><path d="M450 287 V316" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="200" y="322" width="500" height="90" rx="12" fill="#fff" stroke="#7392bb"/><text x="450" y="360.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="450" dy="0">Startup returns false / throws</tspan><tspan x="450" dy="24.3">Outer startup call has returned</tspan></text><path d="M450 413 V442" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="200" y="448" width="500" height="90" rx="12" fill="#fff" stroke="#7392bb"/><text x="450" y="486.97" text-anchor="middle" fill="#11213b" font-size="18" font-weight="400"><tspan x="450" dy="0">Run only enrolled self-contained cleanup</tspan><tspan x="450" dy="24.3">Once; no incomplete this pointer</tspan></text><path d="M450 539 V584" fill="none" stroke="#1464f4" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="300" y="590" width="300" height="66" rx="12" fill="#edf4ff" stroke="#7392bb"/><text x="450" y="630.48" text-anchor="middle" fill="#11213b" font-size="22" font-weight="400"><tspan x="450" dy="0">Exit 1</tspan></text><path d="M200 115 H34 V623 H293" fill="none" stroke="#1464f4" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="114" y="238" text-anchor="middle" fill="#425674" font-size="17" font-weight="400"><tspan x="114" dy="0">Reservation fails:</tspan><tspan x="114" dy="22.950000000000003">do not acquire</tspan></text><path d="M700 367 H756 V623 H607" fill="none" stroke="#1464f4" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="620" y="550" width="150" height="55" fill="#f7faff"/><text x="697" y="568" text-anchor="middle" fill="#425674" font-size="15" font-weight="400"><tspan x="697" dy="0">Unenrolled / unsafe</tspan><tspan x="697" dy="20.25">or cleanup exception</tspan></text><rect x="20" y="697" width="740" height="80" rx="12" fill="#edf4ff"/><text x="390" y="728" text-anchor="middle" fill="#425674" font-size="17" font-weight="400"><tspan x="390" dy="0">Keep all loaded code and unretired owners alive through exit</tspan><tspan x="390" dy="22.950000000000003">No normal shutdown/unload; no business rollback inference</tspan></text></g></svg>
